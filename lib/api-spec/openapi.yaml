openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: opportunities
    description: Opportunity intelligence operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /opportunities/analyze:
    post:
      operationId: analyzeOpportunities
      tags: [opportunities]
      summary: Analyze opportunities for a profile
      description: Deterministically scores demo opportunities against a user's profile and explains eligibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Personalized opportunity analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Invalid profile
  /opportunities/ai-match:
    post:
      operationId: aiMatchOpportunities
      tags: [opportunities]
      summary: AI-narrated opportunity shortlist for a profile
      description: Runs the same deterministic eligibility scoring as /opportunities/analyze, then asks an LLM (Groq/Llama) to write a short, personalized explanation of the top real matches. Never invents opportunities outside the scored set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: AI-narrated shortlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiMatchResult"
        "400":
          description: Invalid profile
        "503":
          description: AI Match is not configured (missing Groq API key) or the upstream call failed
  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Get an opportunity with eligibility reasoning
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityMatch"
        "404":
          description: Opportunity not found
  /saved:
    get:
      operationId: getSavedOpportunities
      tags: [opportunities]
      summary: List saved opportunities for a device
      parameters:
        - $ref: "#/components/parameters/DeviceIdQuery"
      responses:
        "200":
          description: Saved opportunities
          content:
            application/json:
              schema:
                type: object
                required: [opportunities]
                properties:
                  opportunities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Opportunity"
        "400":
          description: Missing deviceId
    post:
      operationId: saveOpportunity
      tags: [opportunities]
      summary: Save an opportunity for a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveOpportunityRequest"
      responses:
        "200":
          description: Saved
        "404":
          description: Opportunity not found
  /saved/{opportunityId}:
    delete:
      operationId: unsaveOpportunity
      tags: [opportunities]
      summary: Remove a saved opportunity for a device
      parameters:
        - $ref: "#/components/parameters/OpportunityIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceIdentifier"
      responses:
        "200":
          description: Removed
components:
  parameters:
    DeviceIdQuery:
      name: deviceId
      in: query
      required: true
      schema:
        type: string
    OpportunityIdPath:
      name: opportunityId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProfileInput:
      type: object
      required:
        - age
        - country
        - region
        - status
        - education
        - interests
        - skills
        - goals
        - budget
        - internationalTravel
        - localTravel
        - preferredTypes
      properties:
        age: { type: number, minimum: 13, maximum: 100 }
        country: { type: string, minLength: 2 }
        region: { type: string, minLength: 2 }
        status:
          type: string
          enum: [student, professional, graduate, founder, unemployed]
        education:
          type: string
          enum: [secondary, undergraduate, graduate, postgraduate]
        interests:
          type: array
          items: { type: string }
          minItems: 1
        skills:
          type: array
          items: { type: string }
        goals: { type: string }
        budget: { type: number, minimum: 0 }
        internationalTravel: { type: boolean }
        localTravel: { type: boolean }
        preferredTypes:
          type: array
          items: { type: string }
          minItems: 1
    Opportunity:
      type: object
      required: [id, title, organization, description, category, tags, eligibleCountries, minAge, maxAge, educationRequirements, studentRequirement, skills, travelRequirement, onlineAvailability, funding, applicationCost, deadline, requiredDocuments, applicationUrl, status, source, verificationDate, demoData]
      properties:
        id: { type: string }
        title: { type: string }
        organization: { type: string }
        description: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        eligibleCountries: { type: array, items: { type: string } }
        minAge: { type: number }
        maxAge: { type: number }
        educationRequirements: { type: array, items: { type: string } }
        studentRequirement: { type: string }
        skills: { type: array, items: { type: string } }
        travelRequirement: { type: string, enum: [none, local, international] }
        onlineAvailability: { type: boolean }
        funding: { type: string }
        applicationCost: { type: number }
        deadline: { type: string, format: date }
        requiredDocuments: { type: array, items: { type: string } }
        applicationUrl: { type: string }
        status: { type: string, enum: [open, closing-soon] }
        source: { type: string }
        verificationDate: { type: string, format: date }
        demoData: { type: boolean }
    OpportunityMatch:
      allOf:
        - $ref: "#/components/schemas/Opportunity"
        - type: object
          required: [score, eligibility, eligibleReasons, concernReasons, missingRequirements, nextActions, daysRemaining]
          properties:
            score: { type: number, minimum: 0, maximum: 100 }
            eligibility: { type: string, enum: [eligible, potential, ineligible] }
            eligibleReasons: { type: array, items: { type: string } }
            concernReasons: { type: array, items: { type: string } }
            missingRequirements: { type: array, items: { type: string } }
            nextActions: { type: array, items: { type: string } }
            daysRemaining: { type: number }
    DeviceIdentifier:
      type: object
      required: [deviceId]
      properties:
        deviceId: { type: string }
    SaveOpportunityRequest:
      type: object
      required: [deviceId, opportunityId]
      properties:
        deviceId: { type: string }
        opportunityId: { type: string }
    AnalysisResult:
      type: object
      required: [total, eligibleCount, potentialCount, ineligibleCount, matches]
      properties:
        total: { type: number }
        eligibleCount: { type: number }
        potentialCount: { type: number }
        ineligibleCount: { type: number }
        matches:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityMatch"
    AiMatchHighlight:
      type: object
      required: [opportunityId, title, whyItFits]
      properties:
        opportunityId: { type: string }
        title: { type: string }
        whyItFits: { type: string }
    AiMatchResult:
      type: object
      required: [summary, highlights, generatedAt]
      properties:
        summary: { type: string }
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/AiMatchHighlight"
        generatedAt: { type: string, format: date-time }

